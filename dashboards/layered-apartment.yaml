views:
- title: Apartment
  path: home
  icon: mdi:home-variant
  type: sections
  max_columns: 2
  dense_section_placement: true
  subview: false
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:studio-dynamic-island
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: custom:studio-climate-weather-card
      weather_entity: weather.forecast_home
      climate_entity: climate.carriercontroller
      sun_entity: sun.sun
      humidity_entity: sensor.co2_humidity
      grid_options:
        columns: 12
        rows: auto
    - type: custom:studio-lights-ambient-card
      title: Studio Lighting
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: custom:studio-media-card
      entity: media_player.bedroom_tv_2
      media_type: video
      title: Video
      icon: mdi:television
      grid_options:
        columns: 12
        rows: auto
    - type: custom:studio-media-card
      entity: media_player.bedroom_speaker
      media_type: music
      title: Music
      icon: mdi:speaker
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: custom:studio-power-flow-card
      title: Studio Power Distribution
      main_entity: sensor.wattmeter_power_minute_average
      today_entity: sensor.wattmeter_energy_today
      balance_entity: sensor.balance_power_minute_average
      popup_hash: '#power'
      circuits:
      - id: fridge
        sector: kitchen
        name: Fridge & Table
        entity: sensor.refrigerator_table_receptacle_power_minute_average
        icon: mdi:fridge-outline
        color: '#F59E0B'
      - id: kitch
        sector: kitchen
        name: Kitchen Outlets
        entity: sensor.kitchen_receptacles_power_minute_average
        icon: mdi:power-socket-us
        color: '#EA580C'
      - id: micro
        sector: kitchen
        name: Microwave & Cook
        entity: sensor.microwave_power_minute_average
        icon: mdi:microwave
        color: '#EF4444'
      - id: bed
        sector: bed
        name: Bedroom Outlets
        entity: sensor.bedroom_receptacles_power_minute_average
        icon: mdi:bed
        color: '#38BDF8'
      - id: print
        sector: bed
        name: 3D Printer
        entity: sensor.klipper_energy_power
        icon: mdi:printer-3d
        color: '#06B6D4'
        subtag: ↳ Bedroom Breaker
        parent: bed
      - id: ceil
        sector: bed
        name: Ceiling & Fan
        entity: sensor.ceiling_lights_fan_power_minute_average
        icon: mdi:ceiling-light
        color: '#FBBF24'
      - id: bal
        sector: bal
        name: Balance Breaker
        entity: sensor.balance_power_minute_average
        icon: mdi:scale-balance
        color: '#94A3B8'
      - id: net
        sector: bal
        name: Network Server
        entity: sensor.networknonups_energy_power
        icon: mdi:server-network
        color: '#A855F7'
        subtag: ↳ Balance Breaker
        parent: bal
      grid_options:
        columns: full
        rows: auto
    - type: custom:studio-klipper-card
      title: MainPi Klipper 3D Printer
      web_url: http://192.168.86.220
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#lights'
        name: Studio
        icon: mdi:floor-plan
        entity: light.ceiling_lights
        show_header: true
        show_close_button: true
        show_previous_button: true
        popup_style: bubble
        popup_mode: default
        with_bottom_offset: true
        close_by_clicking_outside: true
        width_desktop: 560px
        bg_opacity: '86'
        bg_blur: '16'
        shadow_opacity: '36'
        cards:
        - type: custom:bubble-card
          card_type: separator
          name: Studio
          icon: mdi:floor-plan
          modules: []
        - type: custom:bubble-card
          card_type: button
          button_type: switch
          entity: light.ceiling_lights
          name: Ceiling Lights
          icon: mdi:ceiling-light-multiple
          show_name: true
          show_icon: true
          scrolling_effect: true
          card_layout: large
          rows: 3
          use_accent_color: false
          button_action:
            tap_action:
              action: toggle
          hold_action:
            action: more-info
          sub_button:
            main: []
            bottom:
            - entity: light.ceiling_lights
              name: Brightness
              sub_button_type: slider
              light_slider_type: brightness
              always_visible: true
              show_button_info: false
              show_icon: false
              show_name: false
              fill_width: true
              slider_live_update: false
              light_transition: true
              light_transition_time: 280
              allow_light_slider_to_0: false
          modules:
          - studio_fill
        - type: custom:bubble-card
          card_type: button
          button_type: switch
